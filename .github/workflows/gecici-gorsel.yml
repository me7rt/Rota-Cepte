name: Gecici gorsel toplama
on:
  push:
    branches: [claude/project-thread-oje5uw]
    paths: [.github/workflows/gecici-gorsel.yml, .github/gorsel-topla.py, .github/gorsel-indir.py, .github/gorsel-secim.json]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Secilenleri yuksek cozunurlukte indir
        run: |
          python3 .github/gorsel-indir.py cikti/hd "$(cat .github/gorsel-secim.json)"
      - name: Yeni adaylar
        run: |
          python3 .github/gorsel-topla.py cikti/aday '{
            "uzungol": ["Uzungol lake", "bitmap", 8, 1000],
            "uzungol-tr": ["Uzungöl gölü", "bitmap", 6, 1000],
            "uzungol-kis": ["Uzungöl winter", "bitmap", 4, 1000],
            "aslanli": ["Anıtkabir Aslanlı Yol", "bitmap", 6, 1200],
            "aslanli-en": ["Anitkabir Road of Lions", "bitmap", 6, 1200],
            "anit-kule": ["Anıtkabir tower", "bitmap", 4, 1200]
          }' 2400
      - name: video-deneme dalina koy
        run: |
          cd cikti
          git init -q -b video-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Kısa video görsel adayları"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:video-deneme-5
