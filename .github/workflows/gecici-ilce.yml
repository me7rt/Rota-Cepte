name: Gecici ilce kontrol
on:
  push:
    branches: [claude/project-thread-iyhxd3]
    paths: [".github/gecici-ilce.py", ".github/workflows/gecici-ilce.yml"]
permissions:
  contents: write
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - name: Kontrol
        run: python3 .github/gecici-ilce.py
      - name: Sonucu veri-deneme dalina yukle
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b veri-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add -A
          git commit -q -m "Ilce kontrol (gecici)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" veri-deneme
