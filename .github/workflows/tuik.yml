name: TUIK nufus verisi (gecici)
on:
  push:
    branches: [claude/project-thread-tpajlk]
    paths: [".github/workflows/tuik.yml"]
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: TUIK dosyalarini indir
        run: |
          mkdir -p tuik-gecici
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          al() { curl -sSL -m 60 -A "$UA" -o "tuik-gecici/$1" "$2" -w "$1 %{http_code} %{size_download}\n" >> tuik-gecici/durum.txt || echo "$1 HATA" >> tuik-gecici/durum.txt; }
          rm -f tuik-gecici/*
          al nip.html "https://nip.tuik.gov.tr/"
          al nip-adnks.html "https://nip.tuik.gov.tr/Home/Adnks"
          al medas.html "https://biruni.tuik.gov.tr/medas/?kn=95&locale=tr"
          for f in nip.html nip-adnks.html; do grep -oE '(src|href)="[^"]*\.js[^"]*"|url: *"[^"]*"|"/[A-Za-z]+/[A-Za-z]+[^"]{0,60}"' tuik-gecici/$f | sort -u >> tuik-gecici/nip-uclar.txt || true; done
          for js in $(grep -oE 'src="[^"]*\.js[^"]*"' tuik-gecici/nip-adnks.html | sed 's/src="//;s/"$//' | grep -v -E 'jquery|bootstrap|googletag|plausible' | head -8); do
            case "$js" in http*) u="$js";; /*) u="https://nip.tuik.gov.tr$js";; *) u="https://nip.tuik.gov.tr/$js";; esac
            curl -sSL -m 30 -A "$UA" "$u" | grep -oE '.{60}(url|ajax|fetch|Get[A-Z][A-Za-z]+)[^;]{0,140}' | head -40 >> tuik-gecici/nip-js.txt || true
          done
          cat tuik-gecici/durum.txt
      - name: Dala yukle
        run: |
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add tuik-gecici
          git commit -m "TÜİK nüfus dosyaları (geçici)" || exit 0
          git push origin HEAD:${{ github.ref_name }}
