name: Sesli rehber

on:
  push:
    branches: [claude/project-thread-iyhxd3, claude/project-thread-2h3c9c]
    paths: [scripts/ses-ayar.json]

permissions:
  contents: write

jobs:
  hazirla:
    runs-on: ubuntu-latest
    outputs:
      mod: ${{ steps.a.outputs.mod }}
      iller: ${{ steps.a.outputs.iller }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: a
        run: |
          echo "mod=$(jq -r .mod scripts/ses-ayar.json)" >> "$GITHUB_OUTPUT"
          secim=$(jq -c '.iller // empty' scripts/ses-ayar.json)
          echo "iller=${secim:-$(ls docs/data/il | sed 's/.json$//' | jq -R . | jq -sc .)}" >> "$GITHUB_OUTPUT"

  dene:
    needs: hazirla
    if: needs.hazirla.outputs.mod == 'dene'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node scripts/ses-metin.mjs metin && node scripts/ses-uret.mjs metin out dene
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Örnekleri dala yükle
        run: |
          cd out
          git init -q -b ses-ornek
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Ses denemesi"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ses-ornek

  rehber:
    needs: hazirla
    if: needs.hazirla.outputs.mod == 'rehber'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: node scripts/rehber-ses.mjs scripts/rehber-parti-05.json out
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          EN_ERKEK: en-US-AndrewNeural
          HARF_SINIRI: "250000"
      - name: Örnekleri dala yükle
        if: always()
        run: |
          ls out/*.mp3 >/dev/null 2>&1 || { echo "ses yok, yüklenmedi"; exit 0; }
          git clone -q --depth 1 -b rehber-ses "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dal
          mkdir -p dal/parti-05 && cp out/*.mp3 dal/parti-05/ && cd dal
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Yaşayan Rehber parti 5 sesleri"
          git push -q origin rehber-ses

  hepsi:
    needs: hazirla
    if: needs.hazirla.outputs.mod == 'hepsi'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        il: ${{ fromJSON(needs.hazirla.outputs.iller) }}
    env:
      GH_TOKEN: ${{ github.token }}
      IL: ${{ matrix.il }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Önceki kayıtları topla (yeniden seslendirilmesin)
        run: |
          mkdir -p "out/$IL"
          # Dalda zaten olanlar
          git ls-remote --exit-code origin ses-kayitlari >/dev/null 2>&1 && { git fetch -q --depth=1 --filter=blob:none origin ses-kayitlari; git ls-tree --name-only FETCH_HEAD "$IL/" | sed "s#^$IL/##" > var.txt; } || : > var.txt
          echo "dalda: $(wc -l < var.txt)"
          # İlk denemede sürüm sayfalarına yüklenenler: indir (API sınırına takılmaz)
          for dil in tr en; do
            # Sürüm sayfası yoksa sorun değil; ama API sınırı doluysa dur, yoksa hepsi boşuna yeniden seslendirilir
            if ! gh release view "ses-$IL-$dil" --json assets -q '.assets[].name' > rel.txt 2> rel.err; then
              grep -qi "not found" rel.err || { cat rel.err; echo "GitHub API şu an cevap vermiyor, sonra tekrar dene"; exit 1; }
              : > rel.txt
            fi
            cat rel.txt | while read -r f; do
              grep -qx "$f" var.txt && continue
              curl -sSfL -o "out/$IL/$f" "https://github.com/${{ github.repository }}/releases/download/ses-$IL-$dil/$f" || rm -f "out/$IL/$f"
            done
          done
          echo "indirilen: $(ls out/$IL | wc -l)"
      - name: Seslendir
        run: node scripts/ses-metin.mjs metin && ATLA=var.txt node scripts/ses-uret.mjs metin out "$IL"
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      - name: Ses dalına yükle
        if: always()
        env:
          GIT_AUTHOR_NAME: Mert Turanlıoğlu
          GIT_AUTHOR_EMAIL: me7rtt@gmail.com
          GIT_COMMITTER_NAME: Mert Turanlıoğlu
          GIT_COMMITTER_EMAIL: me7rtt@gmail.com
        run: |
          ls out/"$IL"/*.mp3 >/dev/null 2>&1 || { echo "yeni kayıt yok"; exit 0; }
          mkdir dal && cd dal && git init -q && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          mkdir "$IL" && mv ../out/"$IL"/*.mp3 "$IL"/
          # Aynı anda başka iller de yüklüyor: reddedilirse son hali alıp tekrar dene
          for i in $(seq 1 20); do
            if git fetch -q --depth=1 --filter=blob:none origin ses-kayitlari 2>/dev/null; then base=$(git rev-parse FETCH_HEAD); git read-tree "$base"; else base=""; git read-tree --empty; fi
            git add "$IL"
            tree=$(git write-tree)
            if [ -n "$base" ]; then c=$(git commit-tree "$tree" -p "$base" -m "Ses kayıtları: $IL"); else c=$(git commit-tree "$tree" -m "Ses kayıtları: $IL"); fi
            git push -q origin "$c:refs/heads/ses-kayitlari" && { echo "yüklendi ($i. deneme)"; exit 0; }
            sleep $((RANDOM % 15 + 5))
          done
          exit 1
