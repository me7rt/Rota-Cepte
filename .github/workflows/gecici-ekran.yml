name: Gecici ekran goruntuleri
on:
  push:
    branches: [claude/project-thread-tpajlk]
    paths: ["scripts/ekran-cek.js", ".github/workflows/gecici-ekran.yml"]
permissions:
  contents: write
jobs:
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright kur
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null
          npm i -q playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Ekran goruntulerini cek
        run: |
          (cd docs && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          NODE_PATH=/tmp/pw/node_modules node scripts/ekran-cek.js "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/out-ekran"
      - name: Sonucu ekran-deneme dalina yukle
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out-ekran
          git init -q -b ekran-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add -A
          git commit -q -m "Ekran goruntuleri (gecici)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" ekran-deneme
