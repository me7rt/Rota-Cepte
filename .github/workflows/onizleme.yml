name: Onizleme
on:
  push:
    branches: [claude/project-thread-v4ltwk]
    paths: [".github/workflows/onizleme.yml"]
permissions:
  contents: write
jobs:
  onizleme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Cek
        run: |
          (cd docs && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          mkdir -p onizleme
          cat > o.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 390, height: 800 }, deviceScaleFactor: 2, serviceWorkers: 'block', timezoneId: 'Europe/Istanbul' });
            await ctx.addInitScript(() => { for (const [k, x] of [['gezi-dil', 'tr'], ['gezi-tanitim', '1'], ['gezi-yenilik', '6.6.1'], ['gezi-saygi', '2026'], ['gezi-acilis-gordu', '1'], ['gezi-konum-kapali', '1']]) localStorage.setItem(k, x); });
            const p = await ctx.newPage();
            const resim = async () => { await p.evaluate(async () => { await Promise.all([...document.images].filter((i) => !i.complete).map((i) => new Promise((r) => { i.onload = i.onerror = r; setTimeout(r, 12000); }))); }); await p.waitForTimeout(900); };
            await p.goto('http://localhost:8000/'); await p.waitForTimeout(6000);
            await p.evaluate(() => { document.getElementById('splash')?.remove(); document.querySelectorAll('.tanit,.toast').forEach(x => x.remove()); document.getElementById('tabbar').style.display = 'none'; });
            await p.evaluate(() => { document.getElementById('rotaSec').scrollIntoView(); scrollBy(0, -20); });
            for (const [i, x] of [[5, 1280]]) { await p.evaluate((x) => { document.getElementById('rotaKart').scrollLeft = x; }, x); await p.waitForTimeout(800); await resim(); await p.screenshot({ path: `onizleme/rota${i}.png` }); }
            await b.close();
          })();
          JS
          node o.cjs
      - name: Kaydet
        run: |
          git config user.name "Mert Turanlıoğlu"; git config user.email "me7rtt@gmail.com"
          git add onizleme && git commit -qm "Önizleme görüntüleri [skip ci]" && git push
