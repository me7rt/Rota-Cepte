name: Gecici gorsel toplama
on:
  push:
    branches: [claude/project-thread-oje5uw]
    paths: [.github/workflows/gecici-gorsel.yml, .github/gorsel-topla.py]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Commons gorselleri
        run: |
          python3 .github/gorsel-topla.py cikti '{
            "derinkuyu": ["Derinkuyu underground city", "bitmap", 8, 1000],
            "kaymakli": ["Kaymakli underground city", "bitmap", 8, 1000],
            "yeralti": ["underground city Cappadocia", "bitmap", 8, 1000]
          }'
      - name: video-deneme dalina koy
        run: |
          cd cikti
          git init -q -b video-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Kısa video görsel adayları"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:video-deneme-2
