name: Android APK
on:
  workflow_dispatch:
    inputs:
      dal:
        description: "Derlenecek dal (main dışındaki dallar test APK'sı olarak yayınlanır)"
        default: main
  workflow_run:
    workflows: ["Veri hazirla"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: ["docs/**", "assets/**", "capacitor.config.json", "package.json", ".github/workflows/apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    concurrency: { group: apk, cancel-in-progress: true }
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "${{ github.event.inputs.dal || 'main' }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with: { distribution: temurin, java-version: 21 }
      - name: Capacitor kur
        run: npm ci --no-audit --no-fund
      - name: Android projesi olustur
        run: |
          npx cap add android
          # Konum izni (canlı mesafe için)
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />#' android/app/src/main/AndroidManifest.xml
          grep -q "ACCESS_FINE_LOCATION" android/app/src/main/AndroidManifest.xml || { echo "Konum izni eklenemedi"; exit 1; }
          # Paylaşılan Rota Cepte linkleri (me7rt.github.io/Rota-Cepte) uygulamada açılsın; doğrulama dosyası me7rt.github.io/.well-known/assetlinks.json
          sed -i '/android.intent.category.LAUNCHER/{n;s#</intent-filter>#</intent-filter>\n            <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="https" android:host="me7rt.github.io" android:pathPrefix="/Rota-Cepte" />\n            </intent-filter>#}' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="me7rt.github.io"' android/app/src/main/AndroidManifest.xml || { echo "Link yakalama eklenemedi"; exit 1; }
          npx @capacitor/assets generate --android --iconBackgroundColor '#1f4fa3' --splashBackgroundColor '#1f4fa3' || echo "simge uretilemedi, varsayilan kullanilacak"
          # Bildirim simgesi (hafta sonu önerisi): durum çubuğu için beyaz harita iğnesi
          for d in assets/android-bildirim/drawable-*; do mkdir -p "android/app/src/main/res/$(basename $d)"; cp "$d/ic_stat_rota.png" "android/app/src/main/res/$(basename $d)/"; done
          ls android/app/src/main/res/drawable-xxhdpi/ic_stat_rota.png
          npx cap sync android
          # Google Play: en az Android 7 (SDK 24), hedef SDK 36
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle
          printf '\nandroid.suppressUnsupportedCompileSdk=36\n' >> android/gradle.properties
          grep -q 'targetSdkVersion = 36' android/variables.gradle && grep -q 'minSdkVersion = 24' android/variables.gradle || { echo "SDK ayarlanamadi"; exit 1; }
      - name: APK ve Play paketini derle
        env:
          IMZALI: ${{ secrets.KEYSTORE_B64 != '' }}
        run: |
          cd android
          chmod +x gradlew
          # Sürüm kodu: package.json'daki "surumKodu" (varsa), yoksa derleme numarası. Play her yüklemede daha büyük kod ister.
          KOD=$(node -p "require('../package.json').surumKodu || ${{ github.run_number }}")
          sed -i "s/versionCode [0-9]*/versionCode $KOD/; s/versionName \"[^\"]*\"/versionName \"$(node -p "require('../package.json').version")\"/" app/build.gradle
          grep -q "versionCode $KOD" app/build.gradle || { echo "Surum numarasi ayarlanamadi"; exit 1; }
          echo "Sürüm kodu: $KOD"
          if [ "$IMZALI" = "true" ]; then
            # İmza anahtarı derleme sırasında diskte durmaz; imzalama ayrı adımda yapılır
            ./gradlew assembleRelease bundleRelease --no-daemon
          else
            # İmza anahtarı yoksa yayınlama yapma (farklı imzalı APK eskisinin üstüne kurulamaz)
            echo "IMZASIZ=1" >> $GITHUB_ENV
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../RotaCepte.apk
          fi
      - name: İmzala
        if: env.IMZASIZ != '1'
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
          KP: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KS" | base64 -d > ks.jks
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk hizali.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias upload --ks-pass env:KP --key-pass env:KP --out RotaCepte.apk hizali.apk
          cp android/app/build/outputs/bundle/release/app-release.aab RotaCepte.aab
          jarsigner -keystore ks.jks -storepass:env KP -keypass:env KP RotaCepte.aab upload
          rm -f ks.jks
          ls -la RotaCepte.*
      - name: Anahtar dosyasını temizle
        if: always()
        run: rm -f ks.jks hizali.apk
      - name: Play paketini sakla
        if: env.IMZASIZ != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-paketi
          path: RotaCepte.aab
          if-no-files-found: ignore
      - name: Indirme linkine yukle
        if: env.IMZASIZ != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAL: ${{ github.event.inputs.dal || 'main' }}
        run: |
          if [ "$DAL" != "main" ]; then
            # Test sürümü: asıl indirme linkine dokunmaz
            gh release delete apk-deneme --yes --cleanup-tag || true
            gh release create apk-deneme RotaCepte.apk --title "Rota Cepte (test sürümü)" --notes "Yayın öncesi test için. Otomatik üretildi: $(date -u +%Y-%m-%d)" --prerelease --target "$GITHUB_SHA"
            exit 0
          fi
          gh release delete apk-son --yes --cleanup-tag || true
          gh release create apk-son RotaCepte.apk --title "Rota Cepte (deneme sürümü)" --notes "Arkadaşlarla denemek için Android APK. Kurmak için telefonda 'bilinmeyen kaynaklardan yükleme' izni gerekir. Otomatik üretildi: $(date -u +%Y-%m-%d)" --latest
