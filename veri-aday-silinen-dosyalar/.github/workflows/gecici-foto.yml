name: Gecici foto kontrol paftalari
on:
  push:
    branches: [claude/project-thread-iyhxd3]
    paths: ["scripts/gecici-fark.json", ".github/workflows/gecici-foto.yml"]
permissions:
  contents: write
jobs:
  pafta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: pip install -q pillow
      - run: python3 -u scripts/foto-kontrol.py
        env:
          BUTCE: "900"
      - name: Sonucu veri-deneme dalina yukle
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b veri-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add -A
          git commit -q -m "Foto kontrol paftalari (gecici)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" veri-deneme
