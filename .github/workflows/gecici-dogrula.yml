name: Gecici elle yer dogrulama
on:
  push:
    branches: [claude/project-thread-tpajlk]
    paths: ["scripts/elle-dogrula.py", ".github/workflows/gecici-dogrula.yml"]
permissions:
  contents: write
jobs:
  dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/elle-dogrula.py
      - name: Sonucu veri-deneme dalina yukle
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b veri-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add -A
          git commit -q -m "Elle yer dogrulama (gecici)"
          git push -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" veri-deneme
