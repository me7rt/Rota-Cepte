name: Ekran goruntuleri
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ekran:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Playwright kur
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Cek (bu daldaki uygulamadan)
        run: |
          (cd docs && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 2
          BASE=http://localhost:8000/ node .github/ekran.mjs
      - name: ekran-goruntuleri dalina koy
        run: |
          cd ekran
          git init -q -b ekran-goruntuleri
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Ekran goruntuleri"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ekran-goruntuleri
