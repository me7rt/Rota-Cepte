name: TUIK nufus verisi (gecici)
on:
  push:
    branches: [claude/project-thread-tpajlk]
    paths: [".github/workflows/tuik.yml"]
permissions:
  contents: write
jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: TUIK dosyalarini indir
        run: |
          mkdir -p tuik-gecici
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          al() { curl -sSL -m 60 -A "$UA" -o "tuik-gecici/$1" "$2" -w "$1 %{http_code} %{size_download}\n" >> tuik-gecici/durum.txt || echo "$1 HATA" >> tuik-gecici/durum.txt; }
          al adnks-2025.pdf "https://www.tuik.gov.tr/media/announcements/ADNKS_2025TR.pdf"
          al arama.html "https://data.tuik.gov.tr/Search/Search?text=Adrese%20Dayal%C4%B1%20N%C3%BCfus%20Kay%C4%B1t%20Sistemi%20Sonu%C3%A7lar%C4%B1%202025"
          al kategori.html "https://data.tuik.gov.tr/Kategori/GetKategori?p=nufus-ve-demografi-109&dil=1"
          al index.js "https://data.tuik.gov.tr/assets/index-DHVaePSb.js"
          grep -oE '"(https?:)?//[a-zA-Z0-9.-]*tuik[a-zA-Z0-9./_-]*"|"/api[a-zA-Z0-9/_-]*"|"/[A-Za-z]+/[A-Za-z]+(\?[^"]*)?"' tuik-gecici/index.js | sort -u > tuik-gecici/uclar.txt || true
          grep -oE '.{80}(Bulten|bulten|GetBulten|Search)[^;]{0,160}' tuik-gecici/index.js | head -60 > tuik-gecici/bulten-kod.txt || true
          rm -f tuik-gecici/index.js
          cat tuik-gecici/durum.txt
      - name: Dala yukle
        run: |
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add tuik-gecici
          git commit -m "TÜİK nüfus dosyaları (geçici)" || exit 0
          git push origin HEAD:${{ github.ref_name }}
