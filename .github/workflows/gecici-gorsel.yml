name: Gecici gorsel toplama
on:
  push:
    branches: [claude/project-thread-oje5uw]
    paths: [.github/workflows/gecici-gorsel.yml, .github/gorsel-topla.py, .github/gorsel-indir.py]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Commons gorselleri
        run: |
          python3 .github/gorsel-topla.py cikti '{
            "pamukkale": ["Pamukkale travertines", "bitmap", 10],
            "pamukkale-gun": ["Pamukkale sunset", "bitmap", 6],
            "hierapolis": ["Hierapolis theatre", "bitmap", 6],
            "antikhavuz": ["Pamukkale antique pool", "bitmap", 5, 1000],
            "uzungol": ["Uzungöl", "bitmap", 10],
            "uzungol-sis": ["Uzungol fog", "bitmap", 5, 1200],
            "trabzon-yayla": ["Çaykara Trabzon", "bitmap", 5],
            "anitkabir": ["Anıtkabir", "bitmap", 12],
            "anitkabir-gece": ["Anıtkabir night", "bitmap", 5, 1200]
          }'
      - name: video-deneme dalina koy
        run: |
          cd cikti
          git init -q -b video-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Kısa video görsel adayları"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:video-deneme-4
