name: Gecici gorsel toplama
on:
  push:
    branches: [claude/project-thread-oje5uw]
    paths: [.github/workflows/gecici-gorsel.yml, .github/gorsel-topla.py, .github/gorsel-indir.py, .github/gorsel-secim.json]
permissions:
  contents: write
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Yeni adaylar
        run: |
          python3 .github/gorsel-topla.py cikti '{
            "efes-celsus": ["Library of Celsus Ephesus", "bitmap", 8],
            "efes-tiyatro": ["Great Theatre Ephesus", "bitmap", 6],
            "efes-sokak": ["Curetes Street Ephesus", "bitmap", 6],
            "efes-yamac": ["Terrace Houses Ephesus", "bitmap", 6, 1200],
            "nemrut": ["Mount Nemrut statues heads", "bitmap", 8],
            "nemrut-gun": ["Nemrut sunrise", "bitmap", 6, 1200],
            "nemrut-tr": ["Nemrut Dağı", "bitmap", 6],
            "safranbolu": ["Safranbolu houses", "bitmap", 8],
            "safranbolu-tepe": ["Safranbolu Hıdırlık", "bitmap", 5, 1200],
            "cinci": ["Cinci Han Safranbolu", "bitmap", 5, 1200],
            "safranbolu-genel": ["Safranbolu", "bitmap", 8]
          }' 2400
      - name: video-deneme dalina koy
        run: |
          cd cikti
          git init -q -b video-deneme
          git config user.name "Mert Turanlıoğlu"
          git config user.email "me7rtt@gmail.com"
          git add . && git commit -qm "Kısa video görsel adayları"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:video-deneme-6
