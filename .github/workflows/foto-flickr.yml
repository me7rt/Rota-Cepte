name: Flickr arama
on:
  push:
    branches: [foto-rapor]
    paths: [rapor/flickr-liste.json]
permissions:
  contents: write
jobs:
  ara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow && python3 rapor/flickr.py
      - run: |
          git config user.name "Mert Turanlıoğlu"; git config user.email "me7rtt@gmail.com"
          git add rapor/fl rapor/flickr.json && git commit -q -m "Flickr arama sonuçları" && git push
